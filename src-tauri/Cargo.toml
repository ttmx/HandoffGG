[package]
name = "autoswapper"
version = "0.1.0"
description = "Windows audio autoswitcher for SteelSeries wireless headsets"
authors = ["tiago"]
edition = "2021"

[lib]
name = "autoswapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoswapper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
hidapi = "2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
thiserror = "2"
windows = { version = "0.58", features = [
  "implement",
  "UI",
  "UI_ViewManagement",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
] }
