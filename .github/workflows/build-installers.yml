name: Build and publish installers

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        type: string
      release_draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked

      - name: Build Windows installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: npm run tauri -- build

      - name: Upload installer artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v5
        with:
          name: HandoffGG-windows-installers
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.msix
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: build
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: HandoffGG ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseBody: "Windows installer builds for HandoffGG."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}
          prerelease: false
