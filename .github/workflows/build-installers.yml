name: Build and publish installers

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v0.1.0"
        required: true
        type: string
      release_draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build Windows installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: npm run tauri -- build

      - name: Upload installer artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v5
        with:
          name: HandoffGG-windows-installers
          path: |
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: HandoffGG ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseBody: "Installer builds for HandoffGG."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}
          prerelease: false

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    # NO_STRIP: linuxdeploy's bundled `strip` chokes on modern `.relr.dyn` relocation
    # sections; skip stripping. APPIMAGE_EXTRACT_AND_RUN: the AppImage-based bundler tools
    # can't FUSE-mount inside CI, so extract-and-run them instead.
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            clang \
            pkg-config \
            build-essential

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build Linux AppImage
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: npm run tauri -- build

      - name: Upload AppImage artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v5
        with:
          name: HandoffGG-linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseName: HandoffGG ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          releaseBody: "Installer builds for HandoffGG."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}
          prerelease: false
